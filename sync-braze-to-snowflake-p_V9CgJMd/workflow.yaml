schema: workflow/2022.04
name: Sync Braze to Snowflake
settings:
  error_notification: true
  lambda_memory: 1024
  lambda_timeout: 300
  network: net_5Lnie3
triggers:
- id: ti_nNTddJw
steps:
- namespace: fetch_catalog
  runtime: nodejs20.x
  uses: "./fetch_catalog/entry.js"
  props:
    braze:
      authProvisionId: apn_6LhOGA9
- namespace: flatten_catalog
  runtime: nodejs20.x
  uses: "./flatten_catalog/entry.mjs"
  props:
    catalog_items: "{{steps.fetch_catalog.$return_value}}"
- namespace: upsert_questions
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.DIM_SURVEY_QUESTIONS AS tgt
        USING (
            SELECT
                s.value:poll_id::STRING            AS POLL_ID,
                s.value:question_key::STRING       AS QUESTION_KEY,
                s.value:question_type::STRING      AS QUESTION_TYPE,
                s.value:question_text::STRING      AS QUESTION_TEXT,
                s.value:help_text::STRING          AS HELP_TEXT,
                s.value:is_required::BOOLEAN       AS IS_REQUIRED,
                s.value:min_select::NUMBER         AS MIN_SELECT,
                s.value:max_length::NUMBER         AS MAX_LENGTH,
                s.value:placeholder::STRING        AS PLACEHOLDER,
                s.value:show_results::BOOLEAN      AS SHOW_RESULTS,
                s.value:auto_advance::BOOLEAN      AS AUTO_ADVANCE,
                s.value:definition_version::NUMBER AS DEFINITION_VERSION
            FROM TABLE(FLATTEN(INPUT => PARSE_JSON($${{steps.flatten_catalog.$return_value.questions_json}}$$))) s
        ) AS src
        ON tgt.POLL_ID = src.POLL_ID AND tgt.QUESTION_KEY = src.QUESTION_KEY
        WHEN MATCHED THEN UPDATE SET
            tgt.QUESTION_TYPE      = src.QUESTION_TYPE,
            tgt.QUESTION_TEXT      = src.QUESTION_TEXT,
            tgt.HELP_TEXT          = src.HELP_TEXT,
            tgt.IS_REQUIRED        = src.IS_REQUIRED,
            tgt.MIN_SELECT         = src.MIN_SELECT,
            tgt.MAX_LENGTH         = src.MAX_LENGTH,
            tgt.PLACEHOLDER        = src.PLACEHOLDER,
            tgt.SHOW_RESULTS       = src.SHOW_RESULTS,
            tgt.AUTO_ADVANCE       = src.AUTO_ADVANCE,
            tgt.DEFINITION_VERSION = src.DEFINITION_VERSION,
            tgt.UPDATED_AT         = CURRENT_TIMESTAMP()
        WHEN NOT MATCHED THEN INSERT (
            POLL_ID, QUESTION_KEY, QUESTION_TYPE, QUESTION_TEXT, HELP_TEXT,
            IS_REQUIRED, MIN_SELECT, MAX_LENGTH, PLACEHOLDER, SHOW_RESULTS,
            AUTO_ADVANCE, DEFINITION_VERSION
        ) VALUES (
            src.POLL_ID, src.QUESTION_KEY, src.QUESTION_TYPE, src.QUESTION_TEXT, src.HELP_TEXT,
            src.IS_REQUIRED, src.MIN_SELECT, src.MAX_LENGTH, src.PLACEHOLDER, src.SHOW_RESULTS,
            src.AUTO_ADVANCE, src.DEFINITION_VERSION
        )
      query: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.DIM_SURVEY_QUESTIONS AS tgt
        USING (
            SELECT
                s.value:poll_id::STRING            AS POLL_ID,
                s.value:question_key::STRING       AS QUESTION_KEY,
                s.value:question_type::STRING      AS QUESTION_TYPE,
                s.value:question_text::STRING      AS QUESTION_TEXT,
                s.value:help_text::STRING          AS HELP_TEXT,
                s.value:is_required::BOOLEAN       AS IS_REQUIRED,
                s.value:min_select::NUMBER         AS MIN_SELECT,
                s.value:max_length::NUMBER         AS MAX_LENGTH,
                s.value:placeholder::STRING        AS PLACEHOLDER,
                s.value:show_results::BOOLEAN      AS SHOW_RESULTS,
                s.value:auto_advance::BOOLEAN      AS AUTO_ADVANCE,
                s.value:definition_version::NUMBER AS DEFINITION_VERSION
            FROM TABLE(FLATTEN(INPUT => PARSE_JSON($${{steps.flatten_catalog.$return_value.questions_json}}$$))) s
        ) AS src
        ON tgt.POLL_ID = src.POLL_ID AND tgt.QUESTION_KEY = src.QUESTION_KEY
        WHEN MATCHED THEN UPDATE SET
            tgt.QUESTION_TYPE      = src.QUESTION_TYPE,
            tgt.QUESTION_TEXT      = src.QUESTION_TEXT,
            tgt.HELP_TEXT          = src.HELP_TEXT,
            tgt.IS_REQUIRED        = src.IS_REQUIRED,
            tgt.MIN_SELECT         = src.MIN_SELECT,
            tgt.MAX_LENGTH         = src.MAX_LENGTH,
            tgt.PLACEHOLDER        = src.PLACEHOLDER,
            tgt.SHOW_RESULTS       = src.SHOW_RESULTS,
            tgt.AUTO_ADVANCE       = src.AUTO_ADVANCE,
            tgt.DEFINITION_VERSION = src.DEFINITION_VERSION,
            tgt.UPDATED_AT         = CURRENT_TIMESTAMP()
        WHEN NOT MATCHED THEN INSERT (
            POLL_ID, QUESTION_KEY, QUESTION_TYPE, QUESTION_TEXT, HELP_TEXT,
            IS_REQUIRED, MIN_SELECT, MAX_LENGTH, PLACEHOLDER, SHOW_RESULTS,
            AUTO_ADVANCE, DEFINITION_VERSION
        ) VALUES (
            src.POLL_ID, src.QUESTION_KEY, src.QUESTION_TYPE, src.QUESTION_TEXT, src.HELP_TEXT,
            src.IS_REQUIRED, src.MIN_SELECT, src.MAX_LENGTH, src.PLACEHOLDER, src.SHOW_RESULTS,
            src.AUTO_ADVANCE, src.DEFINITION_VERSION
        )
      params: []
- namespace: upsert_options
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.DIM_SURVEY_OPTIONS AS tgt
        USING (
            SELECT
                s.value:poll_id::STRING            AS POLL_ID,
                s.value:question_key::STRING       AS QUESTION_KEY,
                s.value:option_value::STRING       AS OPTION_VALUE,
                s.value:option_label::STRING       AS OPTION_LABEL,
                s.value:option_description::STRING AS OPTION_DESCRIPTION,
                s.value:is_catch_all::BOOLEAN      AS IS_CATCH_ALL,
                s.value:sort_order::NUMBER         AS SORT_ORDER
            FROM TABLE(FLATTEN(INPUT => PARSE_JSON($${{steps.flatten_catalog.$return_value.options_json}}$$))) s
        ) AS src
        ON tgt.POLL_ID = src.POLL_ID
           AND tgt.QUESTION_KEY = src.QUESTION_KEY
           AND tgt.OPTION_VALUE = src.OPTION_VALUE
        WHEN MATCHED THEN UPDATE SET
            tgt.OPTION_LABEL       = src.OPTION_LABEL,
            tgt.OPTION_DESCRIPTION = src.OPTION_DESCRIPTION,
            tgt.IS_CATCH_ALL       = src.IS_CATCH_ALL,
            tgt.SORT_ORDER         = src.SORT_ORDER,
            tgt.UPDATED_AT         = CURRENT_TIMESTAMP()
        WHEN NOT MATCHED THEN INSERT (
            POLL_ID, QUESTION_KEY, OPTION_VALUE, OPTION_SOURCE,
            OPTION_LABEL, OPTION_DESCRIPTION, IS_CATCH_ALL, SORT_ORDER
        ) VALUES (
            src.POLL_ID, src.QUESTION_KEY, src.OPTION_VALUE, 'catalog',
            src.OPTION_LABEL, src.OPTION_DESCRIPTION, src.IS_CATCH_ALL, src.SORT_ORDER
        )
      query: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.DIM_SURVEY_OPTIONS AS tgt
        USING (
            SELECT
                s.value:poll_id::STRING            AS POLL_ID,
                s.value:question_key::STRING       AS QUESTION_KEY,
                s.value:option_value::STRING       AS OPTION_VALUE,
