schema: workflow/2022.04
name: Taxonomy Classification
settings:
  error_notification: true
  lambda_memory: 1028
  lambda_timeout: 240
  network: net_5Lnie3
triggers:
- id: dc_kjuLB8b
- id: hi_VOHV2Qx
steps:
- namespace: extract_poll_id
  runtime: nodejs20.x
  uses: "./extract_poll_id/entry.js"
  props:
    trigger_event: "{{steps.trigger.event}}"
- namespace: check_already_classified
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH already AS (
            SELECT COUNT(*) AS CNT
            FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_TAXONOMY t
            JOIN MCC_RAW.MARKETING_DEV.DIM_SURVEY_OPTIONS o ON o.OPTION_ID = t.OPTION_ID
            WHERE o.POLL_ID = '{{steps.extract_poll_id.$return_value.poll_id}}'
        ),
        classifiable AS (
            SELECT COUNT(*) AS CNT
            FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_QUESTIONS
            WHERE POLL_ID = '{{steps.extract_poll_id.$return_value.poll_id}}'
              AND QUESTION_TYPE IN ('single', 'multi')
        )
        SELECT already.CNT AS ALREADY_CLASSIFIED, classifiable.CNT AS CLASSIFIABLE_CNT
        FROM already, classifiable
      query: |-
        WITH already AS (
            SELECT COUNT(*) AS CNT
            FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_TAXONOMY t
            JOIN MCC_RAW.MARKETING_DEV.DIM_SURVEY_OPTIONS o ON o.OPTION_ID = t.OPTION_ID
            WHERE o.POLL_ID = '{{steps.extract_poll_id.$return_value.poll_id}}'
        ),
        classifiable AS (
            SELECT COUNT(*) AS CNT
            FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_QUESTIONS
            WHERE POLL_ID = '{{steps.extract_poll_id.$return_value.poll_id}}'
              AND QUESTION_TYPE IN ('single', 'multi')
        )
        SELECT already.CNT AS ALREADY_CLASSIFIED, classifiable.CNT AS CLASSIFIABLE_CNT
        FROM already, classifiable
      params: []
- namespace: skip_if_classified
  runtime: nodejs20.x
  uses: "./check_new_polls/entry.mjs"
  props:
    build_result:
      poll_id: "{{steps.extract_poll_id.$return_value.poll_id}}"
      already_classified: "{{steps.check_already_classified.$return_value[0].ALREADY_CLASSIFIED}}"
      classifiable_cnt: "{{steps.check_already_classified.$return_value[0].CLASSIFIABLE_CNT}}"
- namespace: fetch_catalog
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT o.POLL_ID, o.QUESTION_KEY, q.QUESTION_TEXT,
               o.OPTION_VALUE, o.OPTION_LABEL, o.IS_CATCH_ALL
        FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_OPTIONS o
        JOIN MCC_RAW.MARKETING_DEV.DIM_SURVEY_QUESTIONS q
          ON q.POLL_ID = o.POLL_ID AND q.QUESTION_KEY = o.QUESTION_KEY
        WHERE o.POLL_ID = '{{steps.extract_poll_id.$return_value.poll_id}}'
          AND o.OPTION_SOURCE = 'catalog'
          AND q.QUESTION_TYPE IN ('single', 'multi')
        ORDER BY o.QUESTION_KEY, o.SORT_ORDER, o.OPTION_VALUE
      query: |-
        SELECT o.POLL_ID, o.QUESTION_KEY, q.QUESTION_TEXT,
               o.OPTION_VALUE, o.OPTION_LABEL, o.IS_CATCH_ALL
        FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_OPTIONS o
        JOIN MCC_RAW.MARKETING_DEV.DIM_SURVEY_QUESTIONS q
          ON q.POLL_ID = o.POLL_ID AND q.QUESTION_KEY = o.QUESTION_KEY
        WHERE o.POLL_ID = '{{steps.extract_poll_id.$return_value.poll_id}}'
          AND o.OPTION_SOURCE = 'catalog'
          AND q.QUESTION_TYPE IN ('single', 'multi')
        ORDER BY o.QUESTION_KEY, o.SORT_ORDER, o.OPTION_VALUE
      params: []
- namespace: fetch_existing_taxonomies
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        SELECT DISTINCT BUCKET, TAXONOMY_PATH, DEMOGRAPHIC_KEY
        FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_TAXONOMY
        ORDER BY BUCKET, COALESCE(TAXONOMY_PATH, DEMOGRAPHIC_KEY)
      query: |-
        SELECT DISTINCT BUCKET, TAXONOMY_PATH, DEMOGRAPHIC_KEY
        FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_TAXONOMY
        ORDER BY BUCKET, COALESCE(TAXONOMY_PATH, DEMOGRAPHIC_KEY)
      params: []
- namespace: build_prompt
  runtime: nodejs20.x
  uses: "./build_prompt/entry.js"
  props:
    catalog_rows: "{{steps.fetch_catalog.$return_value}}"
    existing_taxonomies: "{{steps.fetch_existing_taxonomies.$return_value}}"
- namespace: classify_with_ai
  runtime: nodejs20.x
  uses: anthropic-chat@0.2.2
  props:
    anthropic:
      authProvisionId: apn_Oghan1O
    model: claude-sonnet-4-6
    userMessage: "{{steps.build_prompt.$return_value.combined_message}}"
    maxTokensToSample: 16384
- namespace: parse_results
  runtime: nodejs20.x
  uses: "./parse_results/entry.js"
  props:
    ai_response: "{{steps.classify_with_ai.$return_value}}"
- namespace: flatten_results
  runtime: nodejs20.x
  uses: "./flatten_results/entry.js"
  props:
    ai_results: "{{steps.parse_results.$return_value}}"
- namespace: upsert_taxonomy
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.DIM_SURVEY_TAXONOMY AS tgt
        USING (
            SELECT
                o.OPTION_ID,
                src.BUCKET,
                src.TAXONOMY_PATH,
                src.TAXONOMY_DEPTH,
                src.TAXONOMY_LEVELS,
                src.DEMOGRAPHIC_KEY,
                src.DEMOGRAPHIC_VALUE,
                src.DEMOGRAPHIC_TYPE,
                src.CONFIDENCE
            FROM (
                SELECT
                    s.value:poll_id::STRING          AS POLL_ID,
                    s.value:question_key::STRING     AS QUESTION_KEY,
                    s.value:option_value::STRING     AS OPTION_VALUE,
                    s.value:bucket::STRING           AS BUCKET,
                    s.value:taxonomy_path::STRING    AS TAXONOMY_PATH,
                    s.value:taxonomy_depth::INTEGER  AS TAXONOMY_DEPTH,
                    s.value:taxonomy_levels          AS TAXONOMY_LEVELS,
                    s.value:demographic_key::STRING  AS DEMOGRAPHIC_KEY,
                    s.value:demographic_value::STRING AS DEMOGRAPHIC_VALUE,
                    s.value:demographic_type::STRING  AS DEMOGRAPHIC_TYPE,
                    s.value:confidence::FLOAT        AS CONFIDENCE
                FROM TABLE(FLATTEN(INPUT => PARSE_JSON($${{steps.flatten_results.$return_value.rows_json}}$$))) s
            ) src
            JOIN MCC_RAW.MARKETING_DEV.DIM_SURVEY_OPTIONS o
              ON o.POLL_ID      = src.POLL_ID
             AND o.QUESTION_KEY = src.QUESTION_KEY
             AND o.OPTION_VALUE = src.OPTION_VALUE
             AND o.OPTION_SOURCE = 'catalog'
        ) AS resolved
        ON  tgt.OPTION_ID = resolved.OPTION_ID
        AND tgt.BUCKET    = resolved.BUCKET
        AND COALESCE(tgt.TAXONOMY_PATH,   '') = COALESCE(resolved.TAXONOMY_PATH,   '')
        AND COALESCE(tgt.DEMOGRAPHIC_KEY, '') = COALESCE(resolved.DEMOGRAPHIC_KEY, '')
        WHEN MATCHED THEN UPDATE SET
            tgt.TAXONOMY_DEPTH    = resolved.TAXONOMY_DEPTH,
            tgt.TAXONOMY_LEVELS   = resolved.TAXONOMY_LEVELS,
            tgt.DEMOGRAPHIC_VALUE = resolved.DEMOGRAPHIC_VALUE,
            tgt.DEMOGRAPHIC_TYPE  = resolved.DEMOGRAPHIC_TYPE,
            tgt.CONFIDENCE        = resolved.CONFIDENCE,
            tgt.UPDATED_AT        = CURRENT_TIMESTAMP()
        WHEN NOT MATCHED THEN INSERT (
            OPTION_ID, BUCKET,
            TAXONOMY_PATH, TAXONOMY_DEPTH, TAXONOMY_LEVELS,
            DEMOGRAPHIC_KEY, DEMOGRAPHIC_VALUE, DEMOGRAPHIC_TYPE,
            CONFIDENCE
        ) VALUES (
            resolved.OPTION_ID, resolved.BUCKET,
            resolved.TAXONOMY_PATH, resolved.TAXONOMY_DEPTH, resolved.TAXONOMY_LEVELS,
            resolved.DEMOGRAPHIC_KEY, resolved.DEMOGRAPHIC_VALUE, resolved.DEMOGRAPHIC_TYPE,
            resolved.CONFIDENCE
        )
      query: |-
        MERGE INTO MCC_RAW.MARKETING_DEV.DIM_SURVEY_TAXONOMY AS tgt
        USING (
            SELECT
                o.OPTION_ID,
                src.BUCKET,
                src.TAXONOMY_PATH,
                src.TAXONOMY_DEPTH,
                src.TAXONOMY_LEVELS,
                src.DEMOGRAPHIC_KEY,
                src.DEMOGRAPHIC_VALUE,
                src.DEMOGRAPHIC_TYPE,
                src.CONFIDENCE
            FROM (
                SELECT
                    s.value:poll_id::STRING          AS POLL_ID,
                    s.value:question_key::STRING     AS QUESTION_KEY,
                    s.value:option_value::STRING     AS OPTION_VALUE,
                    s.value:bucket::STRING           AS BUCKET,
                    s.value:taxonomy_path::STRING    AS TAXONOMY_PATH,
                    s.value:taxonomy_depth::INTEGER  AS TAXONOMY_DEPTH,
                    s.value:taxonomy_levels          AS TAXONOMY_LEVELS,
                    s.value:demographic_key::STRING  AS DEMOGRAPHIC_KEY,
                    s.value:demographic_value::STRING AS DEMOGRAPHIC_VALUE,
                    s.value:demographic_type::STRING  AS DEMOGRAPHIC_TYPE,
                    s.value:confidence::FLOAT        AS CONFIDENCE
                FROM TABLE(FLATTEN(INPUT => PARSE_JSON($${{steps.flatten_results.$return_value.rows_json}}$$))) s
            ) src
            JOIN MCC_RAW.MARKETING_DEV.DIM_SURVEY_OPTIONS o
              ON o.POLL_ID      = src.POLL_ID
             AND o.QUESTION_KEY = src.QUESTION_KEY
             AND o.OPTION_VALUE = src.OPTION_VALUE
             AND o.OPTION_SOURCE = 'catalog'
        ) AS resolved
        ON  tgt.OPTION_ID = resolved.OPTION_ID
        AND tgt.BUCKET    = resolved.BUCKET
        AND COALESCE(tgt.TAXONOMY_PATH,   '') = COALESCE(resolved.TAXONOMY_PATH,   '')
        AND COALESCE(tgt.DEMOGRAPHIC_KEY, '') = COALESCE(resolved.DEMOGRAPHIC_KEY, '')
        WHEN MATCHED THEN UPDATE SET
            tgt.TAXONOMY_DEPTH    = resolved.TAXONOMY_DEPTH,
            tgt.TAXONOMY_LEVELS   = resolved.TAXONOMY_LEVELS,
            tgt.DEMOGRAPHIC_VALUE = resolved.DEMOGRAPHIC_VALUE,
            tgt.DEMOGRAPHIC_TYPE  = resolved.DEMOGRAPHIC_TYPE,
            tgt.CONFIDENCE        = resolved.CONFIDENCE,
            tgt.UPDATED_AT        = CURRENT_TIMESTAMP()
        WHEN NOT MATCHED THEN INSERT (
            OPTION_ID, BUCKET,
            TAXONOMY_PATH, TAXONOMY_DEPTH, TAXONOMY_LEVELS,
            DEMOGRAPHIC_KEY, DEMOGRAPHIC_VALUE, DEMOGRAPHIC_TYPE,
            CONFIDENCE
        ) VALUES (
            resolved.OPTION_ID, resolved.BUCKET,
            resolved.TAXONOMY_PATH, resolved.TAXONOMY_DEPTH, resolved.TAXONOMY_LEVELS,
            resolved.DEMOGRAPHIC_KEY, resolved.DEMOGRAPHIC_VALUE, resolved.DEMOGRAPHIC_TYPE,
            resolved.CONFIDENCE
        )
      params: []
