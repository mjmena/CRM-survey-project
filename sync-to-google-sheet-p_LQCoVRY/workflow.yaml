            FROM MCC_RAW.MARKETING_DEV.STG_SURVEY_RESPONSES,
                 LATERAL FLATTEN(input => RAW_DATA:answers) a
            WHERE RAW_DATA:poll_id::STRING = 'crm-politics-undecided-voters-poll'
            GROUP BY RAW_DATA:poll_id::STRING, a.value:question::STRING, a.value:answer::STRING
        ),
        totals AS (
            SELECT RAW_DATA:poll_id::STRING AS poll_id, COUNT(*) AS total_responses
            FROM MCC_RAW.MARKETING_DEV.STG_SURVEY_RESPONSES
            WHERE RAW_DATA:poll_id::STRING = 'crm-politics-undecided-voters-poll'
            GROUP BY RAW_DATA:poll_id::STRING
        )
        SELECT
            t.poll_id                                     AS POLL_ID,
            t.total_responses                             AS TOTAL_RESPONSES,
            COALESCE(q.QUESTION_TEXT, tally.question_key) AS QUESTION,
            COALESCE(c.OPTION_LABEL, tally.answer_value)  AS ANSWER,
            tally.response_count                          AS RESPONSE_COUNT
        FROM tally
        JOIN totals t ON tally.poll_id = t.poll_id
        LEFT JOIN (
            SELECT DISTINCT POLL_ID, QUESTION_KEY, QUESTION_TEXT
            FROM MCC_RAW.MARKETING_DEV.DIM_SURVEY_CATALOG
        ) q ON tally.poll_id = q.POLL_ID AND tally.question_key = q.QUESTION_KEY
        LEFT JOIN MCC_RAW.MARKETING_DEV.DIM_SURVEY_CATALOG c
