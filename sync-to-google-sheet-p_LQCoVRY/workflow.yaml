schema: workflow/2022.04
name: Sync to Google Sheet
settings:
  error_notification: true
  lambda_memory: 1024
  lambda_timeout: 300
  network: net_5Lnie3
triggers:
- id: ti_WmT11gM
steps:
- namespace: query_all_tallies
  runtime: nodejs20.x
  uses: snowflake-execute-sql-query@0.2.3
  props:
    snowflake:
      authProvisionId: apn_yghdQYJ
    sql:
      value: |-
        WITH tally AS (
            SELECT
                s.RAW_DATA:poll_id::STRING AS poll_id,
                f.key                      AS question,
                f.value::STRING            AS answer,
                COUNT(*)                   AS response_count
            FROM MCC_RAW.MARKETING_DEV.STG_SURVEY_RESPONSES s,
                 LATERAL FLATTEN(input => s.RAW_DATA) f
            WHERE f.key NOT IN ('poll_id','device_id','user_id','submitted_at')
            GROUP BY s.RAW_DATA:poll_id::STRING, f.key, f.value::STRING
        ),
        totals AS (
            SELECT RAW_DATA:poll_id::STRING AS poll_id, COUNT(*) AS total_responses
            FROM MCC_RAW.MARKETING_DEV.STG_SURVEY_RESPONSES
            GROUP BY RAW_DATA:poll_id::STRING
        )
        SELECT t.poll_id AS POLL_ID, t.total_responses, tally.question, tally.answer, tally.response_count
        FROM tally
        JOIN totals t ON tally.poll_id = t.poll_id
        ORDER BY t.poll_id, tally.question, tally.response_count DESC
      query: |-
        WITH tally AS (
            SELECT
                s.RAW_DATA:poll_id::STRING AS poll_id,
                f.key                      AS question,
                f.value::STRING            AS answer,
                COUNT(*)                   AS response_count
            FROM MCC_RAW.MARKETING_DEV.STG_SURVEY_RESPONSES s,
                 LATERAL FLATTEN(input => s.RAW_DATA) f
            WHERE f.key NOT IN ('poll_id','device_id','user_id','submitted_at')
            GROUP BY s.RAW_DATA:poll_id::STRING, f.key, f.value::STRING
        ),
        totals AS (
            SELECT RAW_DATA:poll_id::STRING AS poll_id, COUNT(*) AS total_responses
            FROM MCC_RAW.MARKETING_DEV.STG_SURVEY_RESPONSES
            GROUP BY RAW_DATA:poll_id::STRING
        )
        SELECT t.poll_id AS POLL_ID, t.total_responses, tally.question, tally.answer, tally.response_count
        FROM tally
        JOIN totals t ON tally.poll_id = t.poll_id
        ORDER BY t.poll_id, tally.question, tally.response_count DESC
      params: []
- namespace: build_tally_grids
  runtime: nodejs20.x
  uses: "./build_tally_grids/entry.js"
  props:
    tally_rows: "{{steps.query_all_tallies.$return_value}}"
- namespace: write_tallies_to_sheet
  runtime: nodejs20.x
  uses: "./write_tallies_to_sheet/entry.js"
  props:
    google_sheets:
      authProvisionId: apn_MGhwj7z
    grids: "{{steps.build_tally_grids.$return_value.grids}}"
