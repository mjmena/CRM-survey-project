<title>Pluto Matrix Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE — throwaway. Not production, not loaded by Braze.
  Question: how should PRISM matrix questions render on a phone?
  Five variants of the matrix block in poll-iam.html, switchable by #A..#E (or ?variant=),
  rendered with the four real matrices from the Pluto TV poll
  (crm_prism_surveys: prism_pluto_tv_2026_survey_control).
  Light-only on purpose: it copies the IAM's own tokens, and the IAM has no dark theme.
-->
<style>
  /* Layout: a 390px phone frame holding a copy of the IAM modal; prototype chrome sits outside it. */
  :root {
    --bg1: #fff; --bg2: #f6f8fb; --card: #fff;
    --border: rgba(15, 23, 42, 0.14); --text: #0f172a; --muted: rgba(15, 23, 42, 0.68);
    --a1: #167ba5; --a1-soft: rgba(22, 123, 165, 0.08); --a1-line: rgba(22, 123, 165, 0.28);
    --zebra: rgba(15, 23, 42, 0.04); --r: 16px;
    --page: #dfe5ec; --chrome: #0f172a; --chrome-fg: #fff;
    --ok: #1b7f4a; --warn: #a35a00;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font); color: var(--text); background: var(--page);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 96px;
  }
  .stage { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: flex-start; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
  .tabs button { font: 600 12px var(--font); padding: 7px 11px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--chrome); color: var(--chrome-fg); border-color: var(--chrome); }

  .phone { width: min(390px, 100%); min-width: 0; }
  @media (min-width: 520px) { .phone { border: 10px solid var(--chrome); border-radius: 36px; overflow: hidden; background: var(--page); } }

  /* ---- copied from poll-iam.html ---- */
  .modal { background: linear-gradient(180deg, var(--bg1), var(--bg2)); border: 1px solid var(--border); border-radius: 18px; }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid var(--border); }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); border: 1px solid var(--border); background: rgba(22, 123, 165, 0.06); padding: 6px 10px; border-radius: 99px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--a1); box-shadow: 0 0 0 3px rgba(22, 123, 165, 0.16); }
  .close { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.03); font-size: 20px; color: var(--text); }
  .content { padding: 14px; }
  .title { margin: 0 0 6px; font-size: 18px; }
  .progress { display: flex; gap: 4px; margin-top: 12px; }
  .bar { flex: 1; height: 6px; border-radius: 4px; background: rgba(15, 23, 42, 0.08); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--a1); }
  .card { margin-top: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); }
  .q { margin: 0 0 6px; font-size: 15px; line-height: 1.35; font-weight: 600; }
  .help { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.8); cursor: pointer; margin-top: 8px; font-size: 13.5px; font-weight: 600; }
  .opt.selected { background: var(--a1-soft); border-color: var(--a1); }
  .opt input { margin-top: 2px; accent-color: var(--a1); }
  .nav { display: flex; gap: 10px; margin-top: 14px; }
  .btn { border-radius: 12px; padding: 12px; font: 14px var(--font); color: var(--text); border: 1px solid var(--border); background: rgba(15, 23, 42, 0.03); cursor: pointer; flex: 1; }
  .btn.primary { background: var(--a1); color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .matrix-wrap { overflow-x: auto; }
  .matrix { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .matrix thead th { padding: 4px 1px 8px; font-size: 10px; font-weight: 600; line-height: 1.2; color: var(--muted); text-align: center; vertical-align: bottom; }
  .matrix tbody th { min-width: 72px; padding: 8px 6px; font-weight: 600; text-align: left; }
  .matrix tbody tr:nth-child(odd) { background: var(--zebra); }
  .matrix td { padding: 0; text-align: center; }
  .matrix td label { display: block; padding: 10px 2px; cursor: pointer; }
  .matrix input { width: 18px; height: 18px; margin: 0; accent-color: var(--a1); cursor: pointer; }
  /* ---- end copy ---- */

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  :focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }

  /* B: row cards with wrapping pills */
  .rowcard { padding: 12px 0; border-top: 1px solid var(--border); }
  .rowcard:first-of-type { border-top: 0; padding-top: 4px; }
  .rowlabel { font-size: 13.5px; font-weight: 650; line-height: 1.35; margin: 0 0 8px; display: flex; gap: 6px; align-items: baseline; }
  .tick { color: var(--ok); font-size: 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { position: relative; }
  .pill input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .pill span { display: block; padding: 8px 11px; border-radius: 99px; border: 1px solid var(--border); font-size: 12.5px; line-height: 1.2; background: var(--bg1); cursor: pointer; }
  .pill input:checked + span { background: var(--a1); border-color: var(--a1); color: #fff; }
  .pill input:focus-visible + span { outline: 2px solid var(--a1); outline-offset: 2px; }
  .pill.catch span { border-style: dashed; color: var(--muted); }

  /* C: one row at a time */
  .stepper-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .rowdots { display: flex; gap: 5px; }
  .rowdots button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg1); font: 600 10px var(--font); color: var(--muted); cursor: pointer; padding: 0; }
  .rowdots button.done { background: var(--a1-soft); border-color: var(--a1-line); color: var(--a1); }
  .rowdots button.here { border-color: var(--a1); border-width: 2px; color: var(--text); }
  .bigrow { font-size: 17px; font-weight: 700; line-height: 1.3; margin: 6px 0 2px; min-height: 2.6em; }
  .rownav { display: flex; gap: 8px; margin-top: 10px; }
  .rownav .btn { padding: 9px; font-size: 13px; }

  /* D: accordion */
  .acc { border: 1px solid var(--border); border-radius: 12px; margin-top: 8px; overflow: hidden; background: var(--bg1); }
  .acc > button { all: unset; box-sizing: border-box; width: 100%; display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 12px 14px; cursor: pointer; }
  .acc > button:focus-visible { outline: 2px solid var(--a1); outline-offset: -2px; }
  .acc .lbl { font-size: 13.5px; font-weight: 650; line-height: 1.3; }
  .acc .val { font-size: 12px; color: var(--muted); text-align: right; flex-shrink: 0; max-width: 45%; }
  .acc.answered .val { color: var(--a1); font-weight: 600; }
  .acc.open { border-color: var(--a1); }
  .acc .body { padding: 0 14px 12px; }
  .acc .opt { margin-top: 6px; padding: 10px 12px; }

  /* E: scale strip */
  .legend { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--muted); padding: 0 2px 4px; position: sticky; top: 0; background: var(--card); z-index: 1; }
  .strip { display: grid; gap: 4px; }
  .seg { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
  .seg span { display: flex; align-items: center; justify-content: center; height: 40px; border: 1px solid var(--border); background: var(--bg1); font: 600 13px var(--font); color: var(--muted); cursor: pointer; border-radius: 8px; text-align: center; line-height: 1.15; padding: 2px; }
  .seg input:checked + span { background: var(--a1); border-color: var(--a1); color: #fff; }
  .seg input:focus-visible + span { outline: 2px solid var(--a1); outline-offset: 2px; }
  .strip.brands { grid-template-columns: repeat(3, 1fr); }
  .strip.brands .seg span { font-size: 11.5px; height: 36px; }
  .picked { font-size: 11.5px; color: var(--a1); font-weight: 600; min-height: 1.3em; margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .catchlink { all: unset; cursor: pointer; color: var(--muted); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
  .catchlink[aria-pressed="true"] { color: var(--a1); font-weight: 700; text-decoration: none; }

  /* prototype chrome */
  .state { width: min(390px, 100%); min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; font-size: 12.5px; }
  .state h2 { margin: 0 0 4px; font-size: 13px; }
  .state p { margin: 0 0 10px; color: var(--muted); line-height: 1.45; }
  .state pre { margin: 0; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; background: var(--bg2); padding: 10px; border-radius: 8px; max-height: 320px; overflow: auto; }
  .complete { font-weight: 700; }
  .complete.yes { color: var(--ok); } .complete.no { color: var(--warn); }
  .switcher {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 4px; background: var(--chrome); color: var(--chrome-fg);
    border-radius: 99px; padding: 5px; box-shadow: 0 10px 30px rgba(2, 6, 23, 0.35); z-index: 20; max-width: calc(100% - 24px);
  }
  .switcher button { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
  .switcher button:hover, .switcher button:focus-visible { background: rgba(255, 255, 255, 0.14); }
  .switcher .label { font: 600 13px var(--font); padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
</style>

<div class="tabs" id="tabs" role="group" aria-label="Pluto poll matrix"></div>
<div class="stage">
  <div class="phone">
    <div class="modal" role="dialog" aria-label="Survey">
      <div class="head">
        <div class="badge"><span class="dot"></span><span>Poll</span></div>
        <button class="close" aria-label="Close" tabindex="-1">&times;</button>
      </div>
      <div class="content">
        <h3 class="title">Your Streaming Habits</h3>
        <div class="progress" id="progress"></div>
        <div id="matrix"></div>
        <div class="nav"><button class="btn">Back</button><button class="btn primary" id="next">Next</button></div>
      </div>
    </div>
  </div>
  <aside class="state" aria-live="polite">
    <h2 id="vname"></h2>
    <p id="vnote"></p>
    <div class="complete" id="complete"></div>
    <p style="margin-top:10px">Answers, keyed as <code>normalizeDefinition</code> keys them:</p>
    <pre id="answers"></pre>
  </aside>
</div>

<nav class="switcher" aria-label="Prototype variant">
  <button id="prev" aria-label="Previous variant">&#8249;</button>
  <span class="label" id="vlabel"></span>
  <button id="fwd" aria-label="Next variant">&#8250;</button>
</nav>

<script>
const BRANDS = ['Pluto TV', 'Roku', 'Tubi', 'Samsung TV Plus', 'Xumo', { value: 'None Of These', is_catch_all: true, exclusive: true }];
const opts = list => list.map(o => typeof o === 'string' ? { value: o } : o);
// The four matrices of prism_pluto_tv_2026_survey_control, as normalizeDefinition sees them
// (rows_from / options_from resolved as if the reader had heard of every brand).
const MATRICES = {
  favorability: { page: 4, question: 'What is your overall opinion of each brand?', multi: false,
    rows: ['Pluto TV', 'Roku', 'Tubi', 'Samsung TV Plus', 'Xumo'],
    options: opts(['Very Unfavorable', 'Somewhat Unfavorable', 'Neither Favorable Nor Unfavorable', 'Somewhat Favorable', 'Very Favorable', { value: 'No Opinion', is_catch_all: true }]) },
  association: { page: 5, question: 'Which brands, if any, do you associate with each statement?', help_text: 'Select all that apply.', multi: true,
    rows: ['Has live channels you can flip through, like regular TV', 'Has the biggest selection of movies and shows', "Has shows and movies I can't find on other free services", 'Works on whatever device I want to watch on', 'Lets me start watching without signing up or logging in', "Helps me find something that matches the mood I'm in", "Doesn't interrupt me with too many ads"],
    options: opts(BRANDS) },
  pluto_tv_agree: { page: 6, question: 'How much do you agree or disagree with each statement about Pluto TV?', multi: false,
    rows: ['Is free', 'Is easy to use', 'Has high quality movies', 'Is a streaming service for someone like me'],
    options: opts(['Strongly Disagree', 'Somewhat Disagree', 'Neither Agree Nor Disagree', 'Somewhat Agree', 'Strongly Agree', { value: 'No Opinion', is_catch_all: true }]) },
  pluto_tv_ad: { page: 7, question: 'How likely is it that you saw or heard an ad for Pluto TV in each place?', multi: false,
    rows: ['TV', 'Social Media', 'Website Or Mobile App', 'Podcast Or Streaming Music Service', 'Radio', 'Billboard', 'Newspaper Or Magazine', 'Other'],
    options: opts(['Extremely Unlikely', 'Unlikely', 'Likely', 'Extremely Likely']) },
};
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const VARIANTS = {
  A: { name: 'Current grid', note: 'The table from poll-iam.html today: options are columns, rows are statements. Baseline to compare against.' },
  B: { name: 'Row cards', note: 'Each row is its own block. The options become wrapping pills under the row label. No sideways scroll; every label reads in full. Catch-all options use a dashed outline.' },
  C: { name: 'One row at a time', note: 'One row fills the card with the normal .opt list. A single-choice pick moves to the next row. The numbered dots jump between rows and show progress.' },
  D: { name: 'Accordion', note: 'Rows are a list showing their current answer. Tap a row to open its options. A single-choice pick closes it and opens the next unanswered row.' },
  E: { name: 'Scale strip', note: 'Ordered scales become a numbered strip with the end labels pinned once on top; the chosen label prints under the strip. The catch-all becomes a text link. Brand columns become a 3-up toggle grid.' },
};
const KEYS = Object.keys(VARIANTS);

const state = { variant: 'A', matrix: 'favorability', answers: {}, step: 0, open: 0 };

function readUrl() {
  const fromHash = location.hash.slice(1).toUpperCase();
  const fromQuery = (new URLSearchParams(location.search).get('variant') || '').toUpperCase();
  state.variant = KEYS.includes(fromHash) ? fromHash : KEYS.includes(fromQuery) ? fromQuery : 'A';
}
function setVariant(v) { history.replaceState(null, '', '#' + v); state.variant = v; render(); }

const m = () => MATRICES[state.matrix];
const qk = row => `${state.matrix}__${slug(row)}`;
const ans = row => state.answers[qk(row)];
const answered = row => { const a = ans(row); return Array.isArray(a) ? a.length > 0 : a != null; };
const isOn = (row, v) => m().multi ? (ans(row) || []).includes(v) : ans(row) === v;

function pick(row, value) {
  const k = qk(row), o = m().options.find(x => x.value === value);
  if (!m().multi) { state.answers[k] = value; return true; }
  let cur = state.answers[k] || [];
  if (cur.includes(value)) cur = cur.filter(v => v !== value);
  else if (o.exclusive) cur = [value];
  else cur = cur.filter(v => !m().options.find(x => x.value === v).exclusive).concat(value);
  state.answers[k] = cur;
  return false;
}

function input(row, o, extra = '') {
  return `<input type="${m().multi ? 'checkbox' : 'radio'}" name="${esc(qk(row))}" value="${esc(o.value)}" data-row="${esc(row)}" ${isOn(row, o.value) ? 'checked' : ''} ${extra}>`;
}
const header = () => `<p class="q">${esc(m().question)}</p>${m().help_text ? `<p class="help">${esc(m().help_text)}</p>` : ''}`;

const RENDER = {
  A() {
    const head = m().options.map(o => `<th scope="col">${esc(o.value)}</th>`).join('');
    const rows = m().rows.map(r => `<tr><th scope="row">${esc(r)}</th>${m().options.map(o =>
      `<td><label>${input(r, o, `aria-label="${esc(r + ': ' + o.value)}"`)}</label></td>`).join('')}</tr>`).join('');
    return `<div class="card">${header()}<div class="matrix-wrap"><table class="matrix"><thead><tr><td></td>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  },
  B() {
    const rows = m().rows.map(r => `<fieldset class="rowcard" style="border:0;margin:0;padding-inline:0">
      <legend class="rowlabel">${answered(r) ? '<span class="tick" aria-hidden="true">✓</span>' : ''}${esc(r)}</legend>
      <div class="pills">${m().options.map(o => `<label class="pill${o.is_catch_all ? ' catch' : ''}">${input(r, o)}<span>${esc(o.value)}</span></label>`).join('')}</div>
    </fieldset>`).join('');
    return `<div class="card">${header()}${rows}</div>`;
  },
  C() {
    const rows = m().rows, i = Math.min(state.step, rows.length - 1), r = rows[i];
    const dots = rows.map((x, j) => `<button data-step="${j}" class="${answered(x) ? 'done' : ''}${j === i ? ' here' : ''}" aria-label="Row ${j + 1}: ${esc(x)}">${j + 1}</button>`).join('');
    const list = m().options.map(o => `<label class="opt${isOn(r, o.value) ? ' selected' : ''}">${input(r, o)}<span>${esc(o.value)}</span></label>`).join('');
    return `<div class="card">${header()}
      <div class="stepper-top"><span>${i + 1} of ${rows.length}</span><div class="rowdots">${dots}</div></div>
      <p class="bigrow">${esc(r)}</p>${list}
      <div class="rownav"><button class="btn" data-step="${i - 1}" ${i === 0 ? 'disabled' : ''}>Previous</button>
      <button class="btn" data-step="${i + 1}" ${i === rows.length - 1 ? 'disabled' : ''}>${m().multi ? 'Next statement' : 'Skip ahead'}</button></div></div>`;
  },
  D() {
    const rows = m().rows.map((r, j) => {
      const a = ans(r), val = Array.isArray(a) ? a.join(', ') : a;
      const open = state.open === j;
      return `<div class="acc${answered(r) ? ' answered' : ''}${open ? ' open' : ''}">
        <button data-open="${j}" aria-expanded="${open}"><span class="lbl">${esc(r)}</span><span class="val">${answered(r) ? esc(val) : 'Choose'}</span></button>
        ${open ? `<div class="body">${m().options.map(o => `<label class="opt${isOn(r, o.value) ? ' selected' : ''}">${input(r, o)}<span>${esc(o.value)}</span></label>`).join('')}
          ${m().multi ? `<div class="nav" style="margin-top:8px"><button class="btn" data-open="${j + 1}">Done</button></div>` : ''}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="card">${header()}${rows}</div>`;
  },
  E() {
    if (m().multi) {
      const rows = m().rows.map(r => `<fieldset class="rowcard" style="border:0;margin:0;padding-inline:0">
        <legend class="rowlabel">${answered(r) ? '<span class="tick" aria-hidden="true">✓</span>' : ''}${esc(r)}</legend>
        <div class="strip brands">${m().options.map(o => `<label class="seg">${input(r, o)}<span>${esc(o.value)}</span></label>`).join('')}</div>
      </fieldset>`).join('');
      return `<div class="card">${header()}${rows}</div>`;
    }
    const scale = m().options.filter(o => !o.is_catch_all), catches = m().options.filter(o => o.is_catch_all);
    const rows = m().rows.map(r => {
      const a = ans(r), si = scale.findIndex(o => o.value === a);
      return `<fieldset class="rowcard" style="border:0;margin:0;padding-inline:0">
        <legend class="rowlabel">${answered(r) ? '<span class="tick" aria-hidden="true">✓</span>' : ''}${esc(r)}</legend>
        <div class="strip" style="grid-template-columns:repeat(${scale.length},1fr)">${scale.map((o, j) =>
          `<label class="seg">${input(r, o, `aria-label="${esc(o.value)}"`)}<span>${j + 1}</span></label>`).join('')}</div>
        <div class="picked"><span>${si >= 0 ? esc(scale[si].value) : ''}</span>${catches.map(o =>
          `<button class="catchlink" data-catch="${esc(o.value)}" data-row="${esc(r)}" aria-pressed="${a === o.value}">${esc(o.value)}</button>`).join('')}</div>
      </fieldset>`;
    }).join('');
    return `<div class="card">${header()}<div class="legend"><span>1 · ${esc(scale[0].value)}</span><span>${scale.length} · ${esc(scale[scale.length - 1].value)}</span></div>${rows}</div>`;
  },
};

function render() {
  document.getElementById('tabs').innerHTML = Object.keys(MATRICES).map(k =>
    `<button data-matrix="${k}" aria-pressed="${k === state.matrix}">${k} · ${MATRICES[k].rows.length}×${MATRICES[k].options.length}</button>`).join('');
  document.getElementById('progress').innerHTML = Array.from({ length: 10 }, (_, i) =>
    `<div class="bar"><i style="width:${i + 1 < m().page ? 100 : i + 1 === m().page ? 50 : 0}%"></i></div>`).join('');
  document.getElementById('matrix').innerHTML = RENDER[state.variant]();
  const v = VARIANTS[state.variant];
  document.getElementById('vlabel').textContent = `${state.variant} (${v.name})`;
  document.getElementById('vname').textContent = `${state.variant} · ${v.name}`;
  document.getElementById('vnote').textContent = v.note;
  const done = m().rows.filter(answered).length, all = done === m().rows.length;
  document.getElementById('next').disabled = !all;
  const c = document.getElementById('complete');
  c.className = 'complete ' + (all ? 'yes' : 'no');
  c.textContent = `${done} of ${m().rows.length} rows answered${all ? ' · Next enabled' : ' · required: Next disabled'}`;
  const shown = Object.fromEntries(Object.entries(state.answers).filter(([k]) => k.startsWith(state.matrix + '__')));
  document.getElementById('answers').textContent = JSON.stringify(shown, null, 1) || '{}';
}

document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset.row) return;
  const single = pick(t.dataset.row, t.value);
  const rows = m().rows, j = rows.indexOf(t.dataset.row);
  if (single && state.variant === 'C' && j < rows.length - 1) { render(); setTimeout(() => { state.step = j + 1; render(); }, 280); return; }
  if (single && state.variant === 'D') { const nxt = rows.findIndex(r => !answered(r)); state.open = nxt; }
  render();
});
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.matrix) { state.matrix = t.dataset.matrix; state.step = 0; state.open = 0; render(); }
  else if (t.dataset.step != null) { state.step = Math.max(0, +t.dataset.step); render(); }
  else if (t.dataset.open != null) { const j = +t.dataset.open; state.open = state.open === j ? -1 : j; render(); }
  else if (t.dataset.catch) { pick(t.dataset.row, t.dataset.catch); render(); }
});
const cycle = d => setVariant(KEYS[(KEYS.indexOf(state.variant) + d + KEYS.length) % KEYS.length]);
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('fwd').onclick = () => cycle(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
window.addEventListener('hashchange', () => { readUrl(); render(); });
readUrl();
render();
</script>
